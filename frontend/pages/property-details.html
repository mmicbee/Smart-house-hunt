<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Property Details - Smart House Hunt</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="../index.html">Smart House Hunt</a>
      <nav id="nav-links">
        <a href="properties.html">Find a House</a>
        <a href="../index.html">Home</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <div class="page-head">
      <a class="btn secondary" href="properties.html">&larr; Back to Houses</a>
    </div>

    <p class="form-message" id="message"></p>

    <div id="property-container" class="hidden">
      <div class="property-details-card">
        <div class="details-header">
          <div>
            <h1 id="prop-title"></h1>
            <p class="listing-meta" id="prop-location"></p>
          </div>
          <button type="button" id="fav-toggle-btn" class="btn-fav hidden">
            ♡ Save to Favorites
          </button>
        </div>

        <p class="property-details-price" id="prop-price"></p>

        <div id="prop-images" class="details-images"></div>

        <div class="property-features">
          <div class="feature-item">
            <span class="feature-label">Bedrooms</span>
            <span class="feature-value" id="prop-bedrooms"></span>
          </div>
          <div class="feature-item">
            <span class="feature-label">Bathrooms</span>
            <span class="feature-value" id="prop-bathrooms"></span>
          </div>
          <div class="feature-item">
            <span class="feature-label">Status</span>
            <span class="feature-value badge badge-approved" id="prop-status"></span>
          </div>
        </div>

        <h3>Description</h3>
        <p class="property-description" id="prop-description"></p>

        <div id="amenities-section">
          <h3>Amenities</h3>
          <div id="prop-amenities"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/properties.js"></script>
  <script>
    const messageEl = document.getElementById("message");
    const containerEl = document.getElementById("property-container");
    const favToggleBtn = document.getElementById("fav-toggle-btn");
    const navLinks = document.getElementById("nav-links");

    const currentUser = typeof getCurrentUser === "function" ? getCurrentUser() : null;
    let isFavorited = false;

    function renderNav() {
      if (currentUser) {
        const favLink = document.createElement("a");
        favLink.href = "favorites.html";
        favLink.textContent = "My Favorites";
        navLinks.appendChild(favLink);

        if (currentUser.role === "landlord") {
          const listLink = document.createElement("a");
          listLink.href = "create-property.html";
          listLink.textContent = "List a House";
          const mineLink = document.createElement("a");
          mineLink.href = "my-listings.html";
          mineLink.textContent = "My Listings";
          navLinks.appendChild(listLink);
          navLinks.appendChild(mineLink);
        }

        const logoutLink = document.createElement("a");
        logoutLink.href = "#";
        logoutLink.textContent = `Log out (${currentUser.name})`;
        logoutLink.addEventListener("click", (e) => {
          e.preventDefault();
          logout();
        });
        navLinks.appendChild(logoutLink);
      } else {
        const loginLink = document.createElement("a");
        loginLink.href = "login.html";
        loginLink.textContent = "Login";
        navLinks.appendChild(loginLink);
      }
    }

    function showMessage(text, ok) {
      if (!text) {
        messageEl.textContent = "";
        messageEl.className = "form-message";
        return;
      }
      messageEl.textContent = text;
      messageEl.className = ok ? "form-message success" : "form-message error";
    }

    function updateFavButton(fav) {
      isFavorited = fav;
      favToggleBtn.className = isFavorited ? "btn-fav active" : "btn-fav";
      favToggleBtn.innerHTML = isFavorited ? "♥ Saved to Favorites" : "♡ Save to Favorites";
      favToggleBtn.title = isFavorited ? "Remove from favorites" : "Save to favorites";
    }

    async function loadDetails() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      if (!id) {
        showMessage("Property ID is missing.", false);
        return;
      }

      try {
        const property = await getProperty(id);
        document.title = `${property.title} - Smart House Hunt`;

        document.getElementById("prop-title").textContent = property.title;
        document.getElementById("prop-location").textContent = property.location;
        document.getElementById("prop-price").textContent = `KES ${property.price.toLocaleString()} / month`;
        document.getElementById("prop-bedrooms").textContent = property.bedrooms;
        document.getElementById("prop-bathrooms").textContent = property.bathrooms;
        document.getElementById("prop-status").textContent = property.status;
        document.getElementById("prop-description").textContent = property.description;

        const imagesEl = document.getElementById("prop-images");
        imagesEl.innerHTML = "";
        const images = property.images || [];
        images.forEach((img) => {
          const imgEl = document.createElement("img");
          imgEl.src = `${API_BASE_URL.replace("/api", "")}/${img.file_path}`;
          imgEl.alt = property.title;
          imagesEl.appendChild(imgEl);
        });
        if (images.length === 0) {
          imagesEl.style.display = "none";
        }

        const amenitiesEl = document.getElementById("prop-amenities");
        amenitiesEl.innerHTML = "";
        if (property.amenities && property.amenities.trim() !== "") {
          const items = property.amenities.split(",").map((s) => s.trim()).filter(Boolean);
          items.forEach((item) => {
            const span = document.createElement("span");
            span.className = "amenity-tag";
            span.textContent = item;
            amenitiesEl.appendChild(span);
          });
        } else {
          document.getElementById("amenities-section").style.display = "none";
        }

        if (currentUser) {
          favToggleBtn.classList.remove("hidden");
          try {
            const favCheck = await checkFavorite(id);
            updateFavButton(Boolean(favCheck && favCheck.is_favorite));
          } catch (e) {
            // Ignore favorite check error
          }

          favToggleBtn.onclick = async () => {
            try {
              favToggleBtn.disabled = true;
              if (isFavorited) {
                await removeFavorite(id);
                updateFavButton(false);
                showMessage("Removed from favorites", true);
              } else {
                await addFavorite(id);
                updateFavButton(true);
                showMessage("Saved to favorites", true);
              }
            } catch (err) {
              showMessage(err.message || "Failed to update favorite", false);
            } finally {
              favToggleBtn.disabled = false;
            }
          };
        }

        containerEl.classList.remove("hidden");
      } catch (error) {
        showMessage(error.message || "Property not found.", false);
      }
    }

    renderNav();
    loadDetails();
  </script>
</body>
</html>
