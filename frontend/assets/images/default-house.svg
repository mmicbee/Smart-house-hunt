<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="defBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#defBg)" />

  <!-- Grid overlay -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="50" x2="600" y2="50" />
    <line x1="0" y1="100" x2="600" y2="100" />
    <line x1="0" y1="150" x2="600" y2="150" />
    <line x1="0" y1="200" x2="600" y2="200" />
    <line x1="0" y1="250" x2="600" y2="250" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="0" y1="350" x2="600" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
  </g>

  <!-- Big House Icon -->
  <g transform="translate(180, 80)">
    <!-- Roof -->
    <polygon points="120,20 240,110 0,110" fill="url(#glow)" />
    <!-- Chimney -->
    <rect x="180" y="40" width="20" height="35" fill="#1e40af" />
    <!-- House body -->
    <rect x="25" y="110" width="190" height="120" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="3" />
    <!-- Door -->
    <rect x="95" y="150" width="50" height="80" rx="3" fill="#3b82f6" />
    <circle cx="135" cy="190" r="3" fill="#ffffff" />
    <!-- Windows -->
    <rect x="45" y="130" width="35" height="35" rx="3" fill="#60a5fa" opacity="0.8" />
    <rect x="160" y="130" width="35" height="35" rx="3" fill="#60a5fa" opacity="0.8" />
  </g>

  <!-- Badge / Branding -->
  <rect x="175" y="320" width="250" height="40" rx="20" fill="#2563eb" />
  <text x="300" y="345" fill="#ffffff" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Smart House Hunt</text>
  <text x="300" y="380" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Rental Property Photo Preview</text>
</svg>
