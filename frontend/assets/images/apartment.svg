<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="aptWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="aptFloor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="sofaBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>

  <!-- Wall & Floor -->
  <rect width="600" height="270" fill="url(#aptWall)" />
  <rect y="270" width="600" height="130" fill="url(#aptFloor)" />
  <line x1="0" y1="270" x2="600" y2="270" stroke="#0284c7" stroke-width="2" />

  <!-- Glass Balcony Door / Big Window looking onto skyline -->
  <rect x="50" y="30" width="160" height="230" rx="4" fill="#e0f2fe" stroke="#0369a1" stroke-width="3" />
  <rect x="60" y="40" width="65" height="210" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <rect x="135" y="40" width="65" height="210" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <!-- City buildings silhouette in window -->
  <rect x="70" y="140" width="20" height="100" fill="#7dd3fc" opacity="0.6" />
  <rect x="95" y="110" width="25" height="130" fill="#38bdf8" opacity="0.6" />
  <rect x="145" y="130" width="22" height="110" fill="#38bdf8" opacity="0.6" />
  <rect x="170" y="160" width="25" height="80" fill="#7dd3fc" opacity="0.6" />

  <!-- Wall shelving with books and decor -->
  <rect x="250" y="60" width="120" height="6" rx="2" fill="#64748b" />
  <rect x="260" y="40" width="12" height="20" fill="#f43f5e" />
  <rect x="275" y="35" width="14" height="25" fill="#3b82f6" />
  <rect x="292" y="45" width="10" height="15" fill="#10b981" />
  <circle cx="340" cy="50" r="8" fill="#e2e8f0" stroke="#94a3b8" />

  <!-- Doorway to Master Bedroom -->
  <rect x="420" y="50" width="130" height="220" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
  <rect x="430" y="60" width="110" height="210" fill="#334155" />
  <!-- Inside bedroom peek -->
  <rect x="440" y="160" width="90" height="50" rx="4" fill="#60a5fa" />
  <text x="485" y="130" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">BEDROOM</text>

  <!-- Large Living Room Sectional Sofa -->
  <rect x="180" y="195" width="200" height="80" rx="8" fill="url(#sofaBlue)" />
  <rect x="165" y="210" width="22" height="60" rx="5" fill="#172554" />
  <rect x="365" y="210" width="22" height="60" rx="5" fill="#172554" />
  <rect x="195" y="185" width="80" height="40" rx="4" fill="#2563eb" />
  <rect x="280" y="185" width="80" height="40" rx="4" fill="#2563eb" />

  <!-- Center Table -->
  <rect x="220" y="300" width="120" height="40" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <circle cx="280" cy="320" r="10" fill="#f59e0b" />

  <!-- Hanging Pendant Lights -->
  <line x1="280" y1="0" x2="280" y2="35" stroke="#475569" stroke-width="2" />
  <polygon points="265,50 295,50 280,35" fill="#0f172a" />
  <line x1="330" y1="0" x2="330" y2="45" stroke="#475569" stroke-width="2" />
  <polygon points="315,60 345,60 330,45" fill="#0f172a" />

  <!-- Top Badge Overlay -->
  <rect x="24" y="20" width="190" height="34" rx="17" fill="#1d4ed8" />
  <text x="119" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MODERN APARTMENT</text>

  <!-- Bottom Banner Ribbon -->
  <rect x="0" y="352" width="600" height="48" fill="#0f172a" opacity="0.9" />
  <text x="300" y="381" fill="#93c5fd" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Spacious Living Room, Balcony &amp; Separate Bedrooms</text>
</svg>
