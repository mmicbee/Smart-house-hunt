<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="studioWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="studioFloor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="sofaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
  </defs>

  <!-- Wall & Floor -->
  <rect width="600" height="270" fill="url(#studioWall)" />
  <rect y="270" width="600" height="130" fill="url(#studioFloor)" />
  <line x1="0" y1="270" x2="600" y2="270" stroke="#a855f7" stroke-width="2" />

  <!-- Wall art -->
  <rect x="230" y="50" width="70" height="90" rx="4" fill="#ffffff" stroke="#c084fc" stroke-width="3" />
  <circle cx="265" cy="85" r="16" fill="#f472b6" opacity="0.6" />
  <polygon points="245,120 285,120 265,95" fill="#a855f7" opacity="0.5" />

  <!-- Modern Floor Lamp -->
  <line x1="60" y1="290" x2="90" y2="120" stroke="#6b21a8" stroke-width="3" />
  <ellipse cx="60" cy="290" rx="14" ry="4" fill="#581c87" />
  <polygon points="80,120 100,120 108,90 72,90" fill="#fef08a" stroke="#eab308" stroke-width="1.5" />

  <!-- Sleek Modern Sofa (Left) -->
  <rect x="110" y="210" width="160" height="70" rx="8" fill="url(#sofaGrad)" />
  <rect x="95" y="220" width="20" height="50" rx="6" fill="#6b21a8" />
  <rect x="255" y="220" width="20" height="50" rx="6" fill="#6b21a8" />
  <!-- Cushions -->
  <rect x="125" y="200" width="60" height="40" rx="4" fill="#a855f7" />
  <rect x="185" y="200" width="60" height="40" rx="4" fill="#a855f7" />
  <!-- Throw pillow -->
  <polygon points="135,215 150,230 135,245 120,230" fill="#f472b6" />
  <!-- Sofa legs -->
  <line x1="120" y1="280" x2="115" y2="300" stroke="#581c87" stroke-width="4" stroke-linecap="round" />
  <line x1="250" y1="280" x2="255" y2="300" stroke="#581c87" stroke-width="4" stroke-linecap="round" />

  <!-- Stylish Coffee Table -->
  <ellipse cx="200" cy="320" rx="45" ry="16" fill="#ffffff" stroke="#c084fc" stroke-width="2" />
  <line x1="175" y1="324" x2="170" y2="340" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="round" />
  <line x1="225" y1="324" x2="230" y2="340" stroke="#7e22ce" stroke-width="2.5" stroke-linecap="round" />

  <!-- Partition / Open divider screen -->
  <line x1="330" y1="40" x2="330" y2="270" stroke="#a855f7" stroke-width="3" stroke-dasharray="8,6" />
  <line x1="345" y1="40" x2="345" y2="270" stroke="#a855f7" stroke-width="3" stroke-dasharray="8,6" />

  <!-- Sleeping Area on Right -->
  <!-- Platform bed -->
  <rect x="375" y="210" width="180" height="65" rx="5" fill="#e9d5ff" stroke="#9333ea" stroke-width="2" />
  <rect x="420" y="210" width="135" height="65" rx="3" fill="#7e22ce" />
  <rect x="385" y="195" width="30" height="20" rx="3" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" />
  <rect x="385" y="220" width="30" height="20" rx="3" fill="#ffffff" stroke="#c084fc" stroke-width="1.5" />
  <!-- Headboard -->
  <rect x="365" y="170" width="12" height="110" rx="2" fill="#581c87" />

  <!-- Potted Monstera / Fiddle Leaf Plant -->
  <polygon points="530,335 550,335 545,365 535,365" fill="#f97316" />
  <path d="M 540 335 Q 520 290 535 270 Q 550 280 540 335" fill="#22c55e" />
  <path d="M 540 335 Q 565 300 560 280 Q 545 300 540 335" fill="#16a34a" />
  <path d="M 540 335 Q 535 305 520 300 Q 530 315 540 335" fill="#15803d" />

  <!-- Top Badge Overlay -->
  <rect x="24" y="20" width="220" height="34" rx="17" fill="#7e22ce" />
  <text x="134" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">STUDIO APARTMENT • 0 BED</text>

  <!-- Bottom Banner Ribbon -->
  <rect x="0" y="352" width="600" height="48" fill="#1e1b4b" opacity="0.9" />
  <text x="300" y="381" fill="#e9d5ff" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Open-Plan Modern Studio • Living &amp; Sleeping Space</text>
</svg>
