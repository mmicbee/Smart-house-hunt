<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart House Hunt</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="index.html">Smart House Hunt</a>
      <nav>
        <span id="auth-area"></span>
        <a href="pages/properties.html">Find a House</a>
        <a href="pages/login.html">Login</a>
        <a class="btn" href="pages/register.html">Register</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero container">
      <div>
        <p class="eyebrow">Find a place you can trust</p>
        <h1>Find your next home with confidence.</h1>
        <p class="hero-text">
          Smart House Hunt helps tenants discover rental properties while
          giving landlords a simple way to manage genuine listings.
        </p>
        <div class="hero-actions">
          <a class="btn" href="pages/properties.html">Browse Houses</a>
          <a class="btn secondary" href="pages/register.html">Get Started</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Smart House Hunt</p>
    </div>
  </footer>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const authArea = document.getElementById("auth-area");
    const user = getCurrentUser();

    if (user) {
      const greeting = document.createElement("span");
      greeting.textContent = `Welcome, ${user.name} `;
      const logoutLink = document.createElement("a");
      logoutLink.href = "#";
      logoutLink.textContent = "(log out)";
      logoutLink.addEventListener("click", (event) => {
        event.preventDefault();
        logout();
      });
      authArea.appendChild(greeting);
      authArea.appendChild(logoutLink);
      const favLink = document.createElement("a");
      favLink.href = "pages/favorites.html";
      favLink.textContent = "My Favorites";
      const viewingsLink = document.createElement("a");
      viewingsLink.href = "pages/my-viewings.html";
      viewingsLink.textContent = "My Viewings";
      authArea.appendChild(document.createTextNode(" "));
      authArea.appendChild(favLink);
      authArea.appendChild(document.createTextNode(" "));
      authArea.appendChild(viewingsLink);

      if (user.role === "landlord") {
        const listLink = document.createElement("a");
        listLink.href = "pages/create-property.html";
        listLink.textContent = "List a House";
        const mineLink = document.createElement("a");
        mineLink.href = "pages/my-listings.html";
        mineLink.textContent = "My Listings";
        const inquiriesLink = document.createElement("a");
        inquiriesLink.href = "pages/landlord-viewings.html";
        inquiriesLink.textContent = "Inquiries";
        authArea.appendChild(document.createTextNode(" "));
        authArea.appendChild(listLink);
        authArea.appendChild(document.createTextNode(" "));
        authArea.appendChild(mineLink);
        authArea.appendChild(document.createTextNode(" "));
        authArea.appendChild(inquiriesLink);
      }
    } else {
      const loginLink = document.createElement("a");
      loginLink.href = "pages/login.html";
      loginLink.textContent = "Login";
      authArea.appendChild(loginLink);
    }
  </script>
</body>
</html>
