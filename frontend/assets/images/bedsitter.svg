<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bedBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="wallBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
  </defs>

  <!-- Background Wall & Floor -->
  <rect width="600" height="280" fill="url(#wallBg)" />
  <rect y="280" width="600" height="120" fill="url(#floorGrad)" />
  <line x1="0" y1="280" x2="600" y2="280" stroke="#64748b" stroke-width="2" />

  <!-- Baseboard line -->
  <rect y="272" width="600" height="8" fill="#e2e8f0" stroke="#cbd5e1" />

  <!-- Window with sunlight -->
  <rect x="70" y="40" width="120" height="130" rx="4" fill="#bae6fd" stroke="#0284c7" stroke-width="3" />
  <line x1="130" y1="40" x2="130" y2="170" stroke="#0284c7" stroke-width="2" />
  <line x1="70" y1="105" x2="190" y2="105" stroke="#0284c7" stroke-width="2" />
  <!-- Window Sill -->
  <rect x="62" y="170" width="136" height="8" rx="2" fill="#0284c7" />

  <!-- Small Kitchenette Corner on Left -->
  <rect x="20" y="200" width="130" height="110" rx="3" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <line x1="20" y1="235" x2="150" y2="235" stroke="#94a3b8" stroke-width="2" />
  <!-- Sink faucet -->
  <path d="M 45 195 Q 55 175 65 195" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  <rect x="85" y="193" width="22" height="7" rx="1" fill="#475569" />
  <circle cx="96" cy="190" r="3" fill="#64748b" />
  <!-- Under-counter cabinet handles -->
  <rect x="50" y="260" width="4" height="20" rx="2" fill="#64748b" />
  <rect x="115" y="260" width="4" height="20" rx="2" fill="#64748b" />

  <!-- Bed (Right side) -->
  <!-- Headboard -->
  <rect x="360" y="160" width="16" height="140" rx="3" fill="#64748b" />
  <!-- Bed frame -->
  <rect x="376" y="230" width="180" height="70" rx="4" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2" />
  <!-- Pillows -->
  <rect x="380" y="210" width="30" height="20" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <rect x="380" y="222" width="30" height="18" rx="4" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5" />
  <!-- Blanket Duvet -->
  <rect x="420" y="230" width="136" height="70" rx="2" fill="#2563eb" />
  <path d="M 420 230 Q 430 245 440 230 L 556 230 L 556 300 L 420 300 Z" fill="#1d4ed8" opacity="0.3" />
  <!-- Bed Legs -->
  <rect x="385" y="300" width="10" height="20" fill="#334155" rx="2" />
  <rect x="535" y="300" width="10" height="20" fill="#334155" rx="2" />

  <!-- Bedside Nightstand & Lamp -->
  <rect x="300" y="240" width="50" height="60" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <circle cx="325" cy="270" r="3" fill="#64748b" />
  <!-- Lamp base -->
  <path d="M 315 240 L 335 240 L 328 220 L 322 220 Z" fill="#94a3b8" />
  <line x1="325" y1="220" x2="325" y2="200" stroke="#94a3b8" stroke-width="3" />
  <polygon points="310,200 340,200 330,175 320,175" fill="#fef08a" stroke="#facc15" stroke-width="1.5" />

  <!-- Cozy Rug -->
  <ellipse cx="280" cy="335" rx="90" ry="25" fill="#38bdf8" opacity="0.35" />

  <!-- Top Badge Overlay -->
  <rect x="24" y="20" width="180" height="34" rx="17" fill="#0284c7" />
  <text x="114" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">BEDSITTER • 0 BED</text>

  <!-- Bottom Banner Ribbon -->
  <rect x="0" y="352" width="600" height="48" fill="#0f172a" opacity="0.9" />
  <text x="300" y="381" fill="#38bdf8" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Self-Contained Bedsitter Room • Ready to Rent</text>
</svg>
