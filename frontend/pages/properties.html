<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Houses - Smart House Hunt</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container nav">
      <a class="brand" href="../index.html">Smart House Hunt</a>
      <nav id="nav-links">
        <a href="properties.html">Find a House</a>
        <a href="../index.html">Home</a>
      </nav>
    </div>
  </header>

  <main class="container page">
    <div class="page-head">
      <h1>Find Your Next House</h1>
      <a class="btn secondary" href="../index.html">Back Home</a>
    </div>

    <!-- Search & Filters -->
    <div class="search-filter-card">
      <div class="quick-filter-chips" id="quick-chips">
        <button type="button" class="chip-btn active" data-type="" data-beds="">All Houses</button>
        <button type="button" class="chip-btn" data-type="bedsitter" data-beds="">Bedsitters</button>
        <button type="button" class="chip-btn" data-type="studio" data-beds="">Studio Apartments</button>
        <button type="button" class="chip-btn" data-type="" data-beds="1">1 Bedroom</button>
        <button type="button" class="chip-btn" data-type="" data-beds="2">2 Bedrooms</button>
        <button type="button" class="chip-btn" data-type="" data-beds="3">3 Bedrooms</button>
        <button type="button" class="chip-btn" data-type="" data-beds="4+">4+ Bedrooms</button>
        <button type="button" class="chip-btn" data-type="house" data-beds="">Standalone Houses</button>
      </div>
      <form id="filter-form">
        <div class="search-filter-grid">
          <div class="search-field">
            <label for="location">Location</label>
            <input type="text" id="location" name="location" placeholder="e.g. Nairobi, Kilimani">
          </div>
          <div class="search-field">
            <label for="property_type">House Type</label>
            <select id="property_type" name="property_type">
              <option value="">All Types</option>
              <option value="bedsitter">Bedsitter</option>
              <option value="studio">Studio Apartment</option>
              <option value="apartment">Apartment</option>
              <option value="house">Standalone House / Villa</option>
            </select>
          </div>
          <div class="search-field">
            <label for="bedrooms">Bedrooms</label>
            <select id="bedrooms" name="bedrooms">
              <option value="">Any Bedrooms</option>
              <option value="0">0 Bedrooms (Bedsitter / Studio)</option>
              <option value="1">1 Bedroom</option>
              <option value="2">2 Bedrooms</option>
              <option value="3">3 Bedrooms</option>
              <option value="4+">4+ Bedrooms</option>
            </select>
          </div>
          <div class="search-field">
            <label for="min_price">Min Price (KES)</label>
            <input type="number" id="min_price" name="min_price" placeholder="e.g. 10000" min="0">
          </div>
          <div class="search-field">
            <label for="max_price">Max Price (KES)</label>
            <input type="number" id="max_price" name="max_price" placeholder="e.g. 50000" min="0">
          </div>
          <div class="search-field">
            <label for="bathrooms">Bathrooms</label>
            <select id="bathrooms" name="bathrooms">
              <option value="">Any</option>
              <option value="1">1 Bathroom</option>
              <option value="2">2 Bathrooms</option>
              <option value="3">3+ Bathrooms</option>
            </select>
          </div>
          <div class="search-field">
            <label for="amenities">Amenities</label>
            <input type="text" id="amenities" name="amenities" placeholder="e.g. wifi, parking">
          </div>
          <div class="search-actions">
            <button type="submit" class="btn">Filter</button>
            <button type="button" id="clear-filters" class="btn secondary">Reset</button>
          </div>
        </div>
      </form>
    </div>

    <p class="form-message" id="message"></p>
    <div id="listings" class="listing-grid"></div>
    <p id="empty" class="empty hidden">No houses found matching your criteria.</p>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/properties.js"></script>
  <script>
    const listingsEl = document.getElementById("listings");
    const emptyEl = document.getElementById("empty");
    const message = document.getElementById("message");
    const filterForm = document.getElementById("filter-form");
    const clearBtn = document.getElementById("clear-filters");
    const navLinks = document.getElementById("nav-links");

    let userFavorites = new Set();
    const currentUser = typeof getCurrentUser === "function" ? getCurrentUser() : null;

    function renderNav() {
      if (currentUser) {
        const favLink = document.createElement("a");
        favLink.href = "favorites.html";
        favLink.textContent = "My Favorites";
        navLinks.appendChild(favLink);

        const viewingsLink = document.createElement("a");
        viewingsLink.href = "my-viewings.html";
        viewingsLink.textContent = "My Viewings";
        navLinks.appendChild(viewingsLink);

        if (currentUser.role === "landlord") {
          const listLink = document.createElement("a");
          listLink.href = "create-property.html";
          listLink.textContent = "List a House";
          const mineLink = document.createElement("a");
          mineLink.href = "my-listings.html";
          mineLink.textContent = "My Listings";
          const inquiriesLink = document.createElement("a");
          inquiriesLink.href = "landlord-viewings.html";
          inquiriesLink.textContent = "Viewing Inquiries";
          navLinks.appendChild(listLink);
          navLinks.appendChild(mineLink);
          navLinks.appendChild(inquiriesLink);
        }

        if (currentUser.role === "admin") {
          const adminLink = document.createElement("a");
          adminLink.href = "admin-dashboard.html";
          adminLink.textContent = "Admin Dashboard";
          navLinks.appendChild(adminLink);
        }

        const logoutLink = document.createElement("a");
        logoutLink.href = "#";
        logoutLink.textContent = `Log out (${currentUser.name})`;
        logoutLink.addEventListener("click", (e) => {
          e.preventDefault();
          logout();
        });
        navLinks.appendChild(logoutLink);
      } else {
        const loginLink = document.createElement("a");
        loginLink.href = "login.html";
        loginLink.textContent = "Login";
        navLinks.appendChild(loginLink);
      }
    }

    function showMessage(text, ok) {
      if (!text) {
        message.textContent = "";
        message.className = "form-message";
        return;
      }
      message.textContent = text;
      message.className = ok ? "form-message success" : "form-message error";
    }

    function propertyCard(property) {
      const card = document.createElement("div");
      card.className = "listing-card";

      // Always show house image (uploaded or placeholder)
      const imgLink = document.createElement("a");
      imgLink.href = `property-details.html?id=${property.id}`;
      const img = document.createElement("img");
      img.src = getPropertyImageUrl(property, "../");
      img.alt = property.title;
      img.className = "listing-card-img";
      img.onerror = function() {
        this.onerror = null;
        this.src = "../assets/images/default-house.svg";
      };
      imgLink.appendChild(img);
      card.appendChild(imgLink);

      // House Type Badge
      const metaRow = document.createElement("div");
      metaRow.className = "listing-type-meta";
      const typeBadge = document.createElement("span");
      const propType = (property.property_type || "apartment").toLowerCase();
      typeBadge.className = `badge badge-type badge-${propType}`;
      typeBadge.textContent = getPropertyTypeLabel(property.property_type);
      metaRow.appendChild(typeBadge);
      card.appendChild(metaRow);

      const title = document.createElement("h2");
      const titleLink = document.createElement("a");
      titleLink.href = `property-details.html?id=${property.id}`;
      titleLink.textContent = property.title;
      title.appendChild(titleLink);
      card.appendChild(title);

      const location = document.createElement("p");
      location.className = "listing-meta";
      location.textContent = property.location;
      card.appendChild(location);

      const price = document.createElement("p");
      price.className = "listing-price";
      price.textContent = `KES ${property.price.toLocaleString()} / month`;
      card.appendChild(price);

      const details = document.createElement("p");
      details.className = "listing-meta";
      const bedText = getBedroomDisplay(property);
      const bathText = `${property.bathrooms} ${property.bathrooms === 1 ? 'bath' : 'baths'}`;
      details.textContent = `${bedText} • ${bathText}`;
      card.appendChild(details);

      if (property.amenities) {
        const amenitiesP = document.createElement("p");
        amenitiesP.className = "listing-meta";
        amenitiesP.style.fontSize = "0.85rem";
        amenitiesP.textContent = `Amenities: ${property.amenities}`;
        card.appendChild(amenitiesP);
      }

      const actions = document.createElement("div");
      actions.className = "listing-card-actions";

      const viewLink = document.createElement("a");
      viewLink.className = "btn";
      viewLink.href = `property-details.html?id=${property.id}`;
      viewLink.textContent = "View Details";
      actions.appendChild(viewLink);

      if (currentUser) {
        const isFav = userFavorites.has(property.id);
        const favBtn = document.createElement("button");
        favBtn.type = "button";
        favBtn.className = isFav ? "btn-fav active" : "btn-fav";
        favBtn.innerHTML = isFav ? "♥ Saved" : "♡ Save";
        favBtn.title = isFav ? "Remove from favorites" : "Save to favorites";

        favBtn.addEventListener("click", async () => {
          try {
            favBtn.disabled = true;
            if (userFavorites.has(property.id)) {
              await removeFavorite(property.id);
              userFavorites.delete(property.id);
              favBtn.className = "btn-fav";
              favBtn.innerHTML = "♡ Save";
              favBtn.title = "Save to favorites";
              showMessage("Removed from favorites", true);
            } else {
              await addFavorite(property.id);
              userFavorites.add(property.id);
              favBtn.className = "btn-fav active";
              favBtn.innerHTML = "♥ Saved";
              favBtn.title = "Remove from favorites";
              showMessage("Saved to favorites", true);
            }
          } catch (err) {
            showMessage(err.message || "Failed to update favorite", false);
          } finally {
            favBtn.disabled = false;
          }
        });

        actions.appendChild(favBtn);
      }

      card.appendChild(actions);
      return card;
    }

    async function load(filters = {}) {
      try {
        showMessage("", true);
        if (currentUser && userFavorites.size === 0) {
          try {
            const favData = await getFavoriteIds();
            if (favData && favData.favorite_ids) {
              userFavorites = new Set(favData.favorite_ids);
            }
          } catch (e) {
            // Ignore if favorites can't load
          }
        }

        const data = await loadProperties(filters);
        listingsEl.innerHTML = "";
        const properties = (data && data.properties) || [];
        emptyEl.classList.toggle("hidden", properties.length > 0);
        properties.forEach((property) => {
          listingsEl.appendChild(propertyCard(property));
        });
      } catch (error) {
        showMessage(error.message, false);
      }
    }

    filterForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const formData = new FormData(filterForm);
      const filters = {
        location: formData.get("location"),
        property_type: formData.get("property_type"),
        min_price: formData.get("min_price"),
        max_price: formData.get("max_price"),
        bedrooms: formData.get("bedrooms"),
        bathrooms: formData.get("bathrooms"),
        amenities: formData.get("amenities")
      };
      // Sync chips state
      updateActiveChip(filters.property_type, filters.bedrooms);
      load(filters);
    });

    clearBtn.addEventListener("click", () => {
      filterForm.reset();
      updateActiveChip("", "");
      load({});
    });

    // Quick chips handler
    const chipBtns = document.querySelectorAll(".chip-btn");
    function updateActiveChip(type, beds) {
      chipBtns.forEach((btn) => {
        const bType = btn.getAttribute("data-type") || "";
        const bBeds = btn.getAttribute("data-beds") || "";
        if (type === bType && beds === bBeds) {
          btn.classList.add("active");
        } else {
          btn.classList.remove("active");
        }
      });
    }

    chipBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        chipBtns.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        const type = btn.getAttribute("data-type") || "";
        const beds = btn.getAttribute("data-beds") || "";

        document.getElementById("property_type").value = type;
        document.getElementById("bedrooms").value = beds;

        const formData = new FormData(filterForm);
        const filters = {
          location: formData.get("location"),
          property_type: type,
          bedrooms: beds,
          min_price: formData.get("min_price"),
          max_price: formData.get("max_price"),
          bathrooms: formData.get("bathrooms"),
          amenities: formData.get("amenities")
        };
        load(filters);
      });
    });

    renderNav();
    load({});
  </script>
</body>
</html>
