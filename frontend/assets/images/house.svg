<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="grassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Sky & Garden Grass -->
  <rect width="600" height="260" fill="url(#skyGrad)" />
  <rect y="260" width="600" height="140" fill="url(#grassGrad)" />

  <!-- Sun -->
  <circle cx="520" cy="70" r="30" fill="#facc15" />
  <circle cx="520" cy="70" r="40" fill="#fef08a" opacity="0.4" />

  <!-- Trees on Sides -->
  <!-- Left Tree -->
  <rect x="75" y="210" width="16" height="60" fill="#78350f" rx="3" />
  <circle cx="83" cy="190" r="35" fill="#16a34a" />
  <circle cx="70" cy="170" r="28" fill="#22c55e" />
  <circle cx="95" cy="175" r="28" fill="#15803d" />
  <!-- Right Tree -->
  <rect x="500" y="220" width="14" height="50" fill="#78350f" rx="3" />
  <circle cx="507" cy="200" r="30" fill="#16a34a" />

  <!-- Villa Main House Body -->
  <rect x="160" y="150" width="280" height="130" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <!-- Pitched Roof -->
  <polygon points="140,150 300,70 460,150" fill="url(#roofGrad)" />
  <!-- Chimney -->
  <rect x="380" y="90" width="26" height="40" fill="#b91c1c" />
  <polygon points="375,90 411,90 393,80" fill="#7f1d1d" />

  <!-- Front Porch Pillar & Door -->
  <rect x="275" y="195" width="50" height="85" fill="#475569" rx="2" />
  <circle cx="315" cy="240" r="3" fill="#f59e0b" />
  <!-- Porch canopy -->
  <polygon points="260,195 340,195 300,180" fill="#991b1b" />
  <!-- Porch Steps -->
  <rect x="265" y="280" width="70" height="8" rx="2" fill="#94a3b8" />
  <rect x="255" y="288" width="90" height="8" rx="2" fill="#64748b" />

  <!-- Windows Left (Ground & Upper) -->
  <rect x="185" y="170" width="40" height="35" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="2" />
  <line x1="205" y1="170" x2="205" y2="205" stroke="#0284c7" stroke-width="1.5" />
  <line x1="185" y1="187" x2="225" y2="187" stroke="#0284c7" stroke-width="1.5" />
  <rect x="185" y="225" width="40" height="40" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="2" />
  <line x1="205" y1="225" x2="205" y2="265" stroke="#0284c7" stroke-width="1.5" />
  <line x1="185" y1="245" x2="225" y2="245" stroke="#0284c7" stroke-width="1.5" />

  <!-- Windows Right -->
  <rect x="375" y="170" width="40" height="35" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="2" />
  <line x1="395" y1="170" x2="395" y2="205" stroke="#0284c7" stroke-width="1.5" />
  <line x1="375" y1="187" x2="415" y2="187" stroke="#0284c7" stroke-width="1.5" />
  <rect x="375" y="225" width="40" height="40" rx="3" fill="#bae6fd" stroke="#0284c7" stroke-width="2" />
  <line x1="395" y1="225" x2="395" y2="265" stroke="#0284c7" stroke-width="1.5" />
  <line x1="375" y1="245" x2="415" y2="245" stroke="#0284c7" stroke-width="1.5" />

  <!-- Attic Round Window -->
  <circle cx="300" cy="120" r="14" fill="#bae6fd" stroke="#ffffff" stroke-width="2" />
  <line x1="300" y1="106" x2="300" y2="134" stroke="#ffffff" stroke-width="1.5" />
  <line x1="286" y1="120" x2="314" y2="120" stroke="#ffffff" stroke-width="1.5" />

  <!-- Paved Front Walkway -->
  <polygon points="275,296 325,296 360,352 240,352" fill="#e2e8f0" stroke="#cbd5e1" />

  <!-- Top Badge Overlay -->
  <rect x="24" y="20" width="220" height="34" rx="17" fill="#15803d" />
  <text x="134" y="42" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">STANDALONE HOUSE / VILLA</text>

  <!-- Bottom Banner Ribbon -->
  <rect x="0" y="352" width="600" height="48" fill="#0f172a" opacity="0.9" />
  <text x="300" y="381" fill="#86efac" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle">Private Compound, Garden &amp; Multiple Bedrooms</text>
</svg>
